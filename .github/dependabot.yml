version: 2
updates:
  - package-ecosystem: npm
    directory: /next
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels: [security, maintenance]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [security, devops]
