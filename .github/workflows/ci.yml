name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: next/yarn.lock

      - name: Install dependencies
        working-directory: ./next
        run: yarn install --frozen-lockfile

      - name: Run lint
        working-directory: ./next
        run: yarn lint

      - name: Run type check
        working-directory: ./next
        run: yarn tsc --noEmit

      - name: Audit production dependencies
        working-directory: ./next
        run: yarn audit --groups dependencies --level moderate

      - name: Run tests
        working-directory: ./next
        run: yarn test:run

  # 本番デプロイと同じ Docker 系 actions・Dockerfile で image の build だけを行う（push しない）。
  # deploy_production.yml の build は main へのマージ時にしか動かないため、
  # actions の更新や Dockerfile の変更で build が壊れていないかをここで先に確かめる。
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fork からの PR では GHCR に login できないため、同じリポジトリの PR に限る
      - name: Log in to Container Registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./next
          push: false
          tags: mizuki-hp:ci-${{ github.sha }}
          cache-from: type=gha
