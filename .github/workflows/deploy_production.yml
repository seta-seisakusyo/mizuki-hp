name: Deploy_Production

on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: seta-seisakusyo/mizuki-hp

jobs:
  build-and-push:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: next/yarn.lock

      - name: Install dependencies
        working-directory: ./next
        run: yarn install --frozen-lockfile

      - name: Run lint
        working-directory: ./next
        run: yarn lint

      - name: Run type check
        working-directory: ./next
        run: yarn tsc --noEmit

      - name: Audit production dependencies
        working-directory: ./next
        run: yarn audit --groups dependencies --level moderate

      # テストが落ちたらデプロイしない。
      # vitest は以前から用意されていたが CI で実行されておらず、
      # 実質的に機能していなかった。
      - name: Run tests
        working-directory: ./next
        run: yarn test:run

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./next
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # ビルドキャッシュは ghcr.io の buildcache タグに置く。
          # 以前の type=gha,mode=max はキャッシュの書き込みだけで 30 分前後かかっていた
          # （ビルド本体は 2〜3 分）。ghcr.io への送信は数秒で終わる。
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GH_PAT: ${{ github.token }}
          GH_USERNAME: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          envs: GH_PAT,GH_USERNAME,IMAGE_TAG
          script: |
            set -e

            echo "Deploying mizuki-hp..."

            cd ~/mizuki-hp

            # Load server-owned environment variables. This file is gitignored
            # and survives the reset below.
            if [ ! -f .env ]; then
              echo "ERROR: ~/mizuki-hp/.env does not exist"
              exit 1
            fi
            set -a
            . ./.env
            set +a

            # Generate the production session secret once, without printing it.
            # Existing secrets are never rotated automatically.
            if [ -z "${AUTH_SECRET:-}" ]; then
              if ! command -v openssl >/dev/null 2>&1; then
                echo "ERROR: AUTH_SECRET is missing and openssl is unavailable"
                exit 1
              fi
              echo "AUTH_SECRET is missing; generating and storing a new value in .env"
              umask 077
              AUTH_SECRET="$(openssl rand -hex 32)"
              printf '\nAUTH_SECRET=%s\n' "$AUTH_SECRET" >> .env
              export AUTH_SECRET
            fi
            chmod 600 .env

            : "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
            : "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
            : "${SERVER_NAME:?SERVER_NAME must be set in .env}"
            : "${CERTBOT_EMAIL:?CERTBOT_EMAIL must be set in .env}"
            : "${CERTBOT_DOMAINS:?CERTBOT_DOMAINS must be set in .env}"
            : "${AUTH_SECRET:?AUTH_SECRET must be set in .env}"

            echo "Pulling latest code..."
            git fetch origin main
            git checkout main
            # WARNING: This will discard ALL local changes on the server
            # If you have manual edits on the server, they will be lost
            # Reset to remote state if local changes exist
            git reset --hard origin/main

            echo "Logging in to GitHub Container Registry..."
            echo "${GH_PAT}" | docker login ghcr.io -u "${GH_USERNAME}" --password-stdin

            echo "Pulling image for tag: ${IMAGE_TAG}"
            PREVIOUS_IMAGE=$(docker inspect -f '{{.Config.Image}}' next_app 2>/dev/null || true)
            export IMAGE_TAG="${IMAGE_TAG}"
            docker compose -f docker-compose.yml pull next

            # nginx もサービス停止・migration より前に取得する。
            # 取得できなければ set -e によりここで中断し、稼働中のサービスには触れない。
            # （nginx 1.31.9: CVE-2026-123007 / CVE-2026-123633 などの修正版）
            NGINX_REF=$(docker compose -f docker-compose.yml config --images | grep -E '^(docker\.io/library/)?nginx:' || true)
            if [ -z "$NGINX_REF" ] || [ "$(printf '%s\n' "$NGINX_REF" | wc -l)" -ne 1 ]; then
              echo "ERROR: Compose から nginx のイメージ参照を一意に取得できません: '${NGINX_REF}'"
              exit 1
            fi
            NGINX_EXPECTED_VERSION=$(printf '%s\n' "$NGINX_REF" | sed -nE 's#^.*nginx:([0-9]+\.[0-9]+\.[0-9]+).*#\1#p')
            if [ -z "$NGINX_EXPECTED_VERSION" ]; then
              echo "ERROR: nginx のイメージ参照に固定バージョンがありません: ${NGINX_REF}"
              exit 1
            fi
            docker compose -f docker-compose.yml pull nginx
            # .Id（image ID）はコンテナの .Image と同じ値。RepoDigest は別物なのでログ用。
            NGINX_EXPECTED_ID=$(docker image inspect -f '{{.Id}}' "$NGINX_REF")
            NGINX_DIGEST=$(docker image inspect -f '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$NGINX_REF")
            echo "nginx (pulled): ref=${NGINX_REF} expected=${NGINX_EXPECTED_VERSION} id=${NGINX_EXPECTED_ID} digest=${NGINX_DIGEST:-<none>}"

            echo "Preparing persistent upload directory for the non-root app user..."
            mkdir -p uploads
            docker compose -f docker-compose.yml run --rm --no-deps --user root next \
              sh -c 'chown -R 1001:1001 /app/public/uploads && chmod 0755 /app/public/uploads'

            echo "Starting mysql first..."
            docker compose -f docker-compose.yml up -d mysql redis

            echo "Waiting for MySQL to be ready..."
            i=1
            MYSQL_READY=false
            while [ $i -le 30 ]; do
              # Use container's MYSQL_ROOT_PASSWORD environment variable
              if docker compose -f docker-compose.yml exec -T mysql sh -c 'mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent' </dev/null 2>/dev/null; then
                echo "MySQL is ready!"
                MYSQL_READY=true
                break
              fi
              echo "Waiting for MySQL... ($i/30)"
              sleep 2
              i=$((i+1))
            done

            if [ "$MYSQL_READY" = "false" ]; then
              echo "ERROR: MySQL failed to become ready after 60 seconds"
              exit 1
            fi

            echo "Running database migrations..."
            if ! docker compose -f docker-compose.yml run --rm next node node_modules/prisma/build/index.js migrate deploy; then
              echo "ERROR: Database migration failed"
              exit 1
            fi
            echo "Database migrations completed successfully"

            echo "Starting app containers..."
            docker compose -f docker-compose.yml up -d next nginx

            echo "Checking SSL certificate..."
            # CERT_NAME is derived from SERVER_NAME in .env
            CERT_NAME="${CERT_NAME:-${SERVER_NAME:-localhost}}"
            CERT_PATH="./certbot/conf/live/${CERT_NAME}/fullchain.pem"
            if [ ! -f "$CERT_PATH" ]; then
              echo "SSL certificate not found. Obtaining certificate..."
              if docker compose --profile ssl -f docker-compose.yml run --rm certbot; then
                echo "SSL certificate obtained successfully. Restarting nginx with SSL..."
                docker compose -f docker-compose.yml restart nginx
              else
                echo "ERROR: SSL certificate acquisition failed. Nginx remains fail-closed."
                echo "Check DNS settings and ensure port 80 is accessible."
                exit 1
              fi
            else
              echo "SSL certificate exists. Checking for renewal..."
              # 失敗を握りつぶすと更新できていないことに気づけないため、
              # デプロイは止めずに警告として必ず可視化する
              if docker compose --profile ssl -f docker-compose.yml run --rm certbot renew --quiet; then
                docker compose -f docker-compose.yml restart nginx
              else
                echo "::warning::SSL certificate renewal FAILED. Check certbot logs on the server."
                echo "WARNING: SSL renewal failed. Nginx will restart with the existing certificate."
                docker compose -f docker-compose.yml restart nginx
              fi
            fi

            echo "Running health check..."
            HEALTH_URL="http://localhost:2999/api/health"
            HEALTH_OK=false
            for i in $(seq 1 10); do
              if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                echo "Health check passed!"
                HEALTH_OK=true
                break
              fi
              echo "Waiting for application to be ready... ($i/10)"
              sleep 3
            done

            if [ "$HEALTH_OK" = "false" ]; then
              echo "ERROR: Health check failed after 30 seconds"
              echo "Application is not responding correctly"
              if [ -n "$PREVIOUS_IMAGE" ]; then
                PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
                echo "Rolling application container back to ${PREVIOUS_TAG}..."
                IMAGE_TAG="$PREVIOUS_TAG" docker compose -f docker-compose.yml up -d next nginx
              fi
              exit 1
            fi

            # 稼働中の nginx が pull したイメージ・固定版で動いていることを照合する。
            # restart では新イメージにならないため、旧版が残っていれば失敗にする。
            echo "Verifying running nginx..."
            NGINX_CID=$(docker compose -f docker-compose.yml ps -q nginx)
            if [ -z "$NGINX_CID" ]; then
              echo "ERROR: nginx コンテナが起動していません"
              exit 1
            fi
            NGINX_RUNNING_ID=$(docker inspect -f '{{.Image}}' "$NGINX_CID")
            if [ "$NGINX_RUNNING_ID" != "$NGINX_EXPECTED_ID" ]; then
              echo "ERROR: nginx は image ${NGINX_RUNNING_ID} で起動しています（期待 ${NGINX_EXPECTED_ID} = ${NGINX_REF}）"
              exit 1
            fi
            docker compose -f docker-compose.yml exec -T nginx nginx -t </dev/null
            # nginx -v は標準エラーへ出力する
            NGINX_V_OUT=$(docker compose -f docker-compose.yml exec -T nginx nginx -v </dev/null 2>&1)
            NGINX_RUNNING_VERSION=$(printf '%s\n' "$NGINX_V_OUT" | sed -nE 's#^nginx version: nginx/([0-9]+\.[0-9]+\.[0-9]+).*#\1#p')
            if [ "$NGINX_RUNNING_VERSION" != "$NGINX_EXPECTED_VERSION" ]; then
              echo "ERROR: nginx の実バージョン '${NGINX_RUNNING_VERSION}' が期待 '${NGINX_EXPECTED_VERSION}' と一致しません"
              exit 1
            fi
            NGINX_RUNNING_DIGEST=$(docker image inspect -f '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$NGINX_RUNNING_ID")
            echo "nginx (running): version=${NGINX_RUNNING_VERSION} id=${NGINX_RUNNING_ID} digest=${NGINX_RUNNING_DIGEST:-<none>}"

            echo "Checking HTTPS edge health..."
            curl --fail --silent --show-error --max-time 15 "https://${SERVER_NAME}/api/health" > /dev/null

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment completed successfully!"
